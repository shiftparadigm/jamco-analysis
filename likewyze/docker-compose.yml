version: '3.8'

services:
  likewize-wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8889:80"
    environment:
      - SITE_URL=http://localhost:8889
    volumes:
      # Mount theme for live development
      - ./theme:/var/www/html/wp-content/themes/likewize
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: likewize-network
