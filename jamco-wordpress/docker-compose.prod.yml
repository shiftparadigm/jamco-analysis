version: '3.8'

services:
  wordpress:
    image: jamco-wordpress-prod:latest
    container_name: jamco-wordpress
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: always
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress_password_change_me}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${DOMAIN}');
        define('WP_SITEURL', '${DOMAIN}');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wordpress_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/jamco
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: jamco-mysql
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress_password_change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    command: '--default-authentication-plugin=mysql_native_password'

volumes:
  wordpress_data:
  db_data:
